plugins { id 'com.android.application' }

android {
    namespace 'com.zhanxu.cloud'
    compileSdk 34

    defaultConfig {
        applicationId "com.zhanxu.cloud"
        minSdk 23
        targetSdk 34
        versionCode 119
        versionName "1.1.9"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
