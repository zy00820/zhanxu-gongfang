<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>栈序云 · 用户版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh;background:#080b12;background-image:linear-gradient(rgba(20,40,80,0.18) 1px,transparent 1px),linear-gradient(90deg,rgba(20,40,80,0.18) 1px,transparent 1px);background-size:40px 40px;color:#e8edf7}
/* 登录 */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:0.5;pointer-events:none;z-index:0}
.blob-1{width:320px;height:320px;background:#4a9eff;top:-80px;left:-60px;animation:f1 12s ease-in-out infinite}
.blob-2{width:280px;height:280px;background:#a78bfa;bottom:-60px;right:-40px;animation:f2 14s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.15)}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,-40px) scale(1.1)}}
.login-box{position:relative;z-index:1;width:100%;max-width:380px;background:rgba(255,255,255,0.08);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,0.18);border-radius:24px;padding:36px 28px;box-shadow:0 8px 32px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.25)}
.login-logo{text-align:center;margin-bottom:26px}
.login-logo .mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#73b8ff,#a78bfa);display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;margin-bottom:14px;box-shadow:0 6px 20px rgba(115,184,255,0.4)}
.login-logo h1{font-size:20px;color:#f0f5ff;font-weight:600}
.login-logo p{font-size:12.5px;color:rgba(255,255,255,0.55);margin-top:6px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:rgba(255,255,255,0.6);margin-bottom:7px}
.field input{width:100%;padding:13px 16px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:12px;color:#fff;font-size:15px;outline:none;transition:all .25s}
.field input:focus{border-color:rgba(115,184,255,0.6);background:rgba(255,255,255,0.12)}
.field input::placeholder{color:rgba(255,255,255,0.3)}
.btn-login{width:100%;padding:14px;margin-top:8px;background:linear-gradient(135deg,#73b8ff,#5b8def);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.login-err{color:#f87171;font-size:12px;text-align:center;min-height:18px;margin-top:10px}
/* 顶部 */
.topbar{position:sticky;top:0;z-index:100;background:rgba(8,11,18,0.75);backdrop-filter:blur(16px);border-bottom:1px solid rgba(115,184,255,0.15);padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
.topbar .logo{font-size:17px;font-weight:600;color:#73b8ff}
.topbar .logo small{font-size:11px;color:#607494;font-weight:400;margin-left:6px}
.user-chip{display:flex;align-items:center;gap:10px;cursor:pointer;background:rgba(115,184,255,0.1);border:1px solid rgba(115,184,255,0.2);padding:5px 12px 5px 5px;border-radius:99px}
.user-chip .avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#080b12;background:linear-gradient(135deg,#73b8ff,#a78bfa)}
.user-chip .uname{font-size:13px;color:#d4e4fb}
.container{max-width:720px;margin:0 auto;padding:14px}
/* 卡片 */
.card{background:rgba(255,255,255,0.06);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 8px 32px rgba(0,0,0,0.25),inset 0 1px 0 rgba(255,255,255,0.15);position:relative;overflow:hidden}
.liquid{position:absolute;border-radius:50%;filter:blur(40px);opacity:0.35;pointer-events:none;z-index:0}
.card>*{position:relative;z-index:1}
/* tab */
.tabs{display:flex;gap:6px;background:rgba(255,255,255,0.03);padding:4px;border-radius:12px;border:1px solid rgba(115,184,255,0.1);margin-bottom:14px}
.tab{flex:1;padding:9px;text-align:center;font-size:13px;color:#94a8c7;border-radius:9px;cursor:pointer;transition:all .2s}
.tab.active{background:rgba(115,184,255,0.15);color:#73b8ff;font-weight:500}
.view{display:none}
.view.active{display:block}
/* 签到 */
.sign-row{display:flex;justify-content:space-between;align-items:center}
.btn-sign{padding:10px 20px;background:linear-gradient(135deg,#73b8ff,#5b8def);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.btn-sign.done{background:rgba(52,211,153,0.2);color:#34d399}
.activity-tag{font-size:10px;padding:2px 8px;border-radius:5px;background:rgba(52,211,153,0.18);color:#34d399}
.btn-signup{width:100%;padding:9px;background:rgba(115,184,255,0.15);border:1px solid rgba(115,184,255,0.35);color:#73b8ff;border-radius:8px;font-size:13px;cursor:pointer;margin-top:8px}
/* 工单 */
.card input,.card textarea{width:100%;padding:11px 14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-size:13px;outline:none;margin-bottom:8px;font-family:inherit}
/* 弹窗 */
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;backdrop-filter:blur(4px)}
.sheet{position:absolute;bottom:0;left:0;right:0;background:rgba(15,20,30,0.95);backdrop-filter:blur(28px) saturate(180%);border-top:1px solid rgba(115,184,255,0.3);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{text-align:center;font-size:15px;font-weight:600;color:#f0f5ff;margin-bottom:16px}
.avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.avatar-opt{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#080b12;cursor:pointer;border:3px solid transparent;transition:all .2s}
.avatar-opt.sel{border-color:#73b8ff;transform:scale(1.1)}
.sheet input{width:100%;padding:12px 14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-size:14px;outline:none;margin-bottom:10px}
.sheet .btn{width:100%;padding:13px;border-radius:12px;font-size:15px;cursor:pointer;border:none;margin-top:6px}
.sheet .btn-primary{background:linear-gradient(135deg,#73b8ff,#5b8def);color:#fff;font-weight:600}
.sheet .btn-ghost{background:rgba(255,255,255,0.06);color:#94a8c7}
/* toast */
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:rgba(20,28,45,0.95);border:1px solid rgba(115,184,255,0.3);color:#e8edf7;padding:12px 22px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:all .3s;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#app{display:none}
#app.logged-in{display:block}
</style>
</head>
<body>

<!-- 登录 -->
<div class="login-page" id="loginPage">
  <div class="blob blob-1"></div><div class="blob blob-2"></div>
  <div class="login-box">
    <div class="login-logo">
      <div class="mark">栈</div>
      <h1>栈序云 · 用户版</h1>
      <p>请使用账号登录</p>
    </div>
    <div class="field"><label>账号</label><input type="text" id="inpUser" placeholder="请输入账号"></div>
    <div class="field"><label>密码</label><input type="password" id="inpPwd" placeholder="请输入密码"></div>
    <div class="login-err" id="loginErr"></div>
    <button class="btn-login" onclick="doLogin()">登 录</button>
  </div>
</div>

<!-- 主界面 -->
<div id="app">
  <div class="topbar">
    <div class="logo">栈序云<small>用户版</small></div>
    <div class="user-chip" onclick="openProfile()">
      <div class="avatar" id="myAvatar">张</div>
      <div class="uname" id="myName">张岳</div>
    </div>
  </div>

  <div class="container">
    <div class="tabs">
      <div class="tab active" data-view="home">首页</div>
      <div class="tab" data-view="ticket">工单</div>
      <div class="tab" data-view="me">我的</div>
    </div>

    <!-- 首页 -->
    <div class="view active" id="view-home">
      <!-- 签到 -->
      <div class="card">
        <div class="liquid" style="width:120px;height:120px;background:#73b8ff;top:-30px;right:-20px"></div>
        <div class="sign-row">
          <div>
            <div style="font-size:15px;font-weight:600;color:#f0f5ff;margin-bottom:4px">每日签到</div>
            <div style="font-size:12px;color:#607494">连续签到 <span id="signDays" style="color:#fbbf24;font-weight:600">3</span> 天 · 余额 ¥<span id="myBalance" style="color:#34d399;font-weight:600">0.00</span></div>
          </div>
          <button class="btn-sign" id="btnSign" onclick="doSign()">签到</button>
        </div>
      </div>

      <!-- 活动中心 -->
      <div class="card">
        <div class="liquid" style="width:150px;height:150px;background:#a78bfa;top:-40px;right:-30px"></div>
        <div style="font-size:15px;font-weight:600;color:#f0f5ff;margin-bottom:10px">活动中心</div>
        <div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <div style="font-size:13px;font-weight:600;color:#f0f5ff">有奖建议信</div>
            <span class="activity-tag">报名中</span>
          </div>
          <div style="font-size:11px;color:#a0b4d2">最高赢取666元 · 截止 2026-11-15</div>
          <button class="btn-signup" onclick="location.href='https://v.wjx.cn/vm/P4N9I4h.aspx'">立即报名</button>
        </div>
        <div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <div style="font-size:13px;font-weight:600;color:#f0f5ff">知识问答</div>
            <span class="activity-tag">报名中</span>
          </div>
          <div style="font-size:11px;color:#a0b4d2">最高赢取666元</div>
          <button class="btn-signup" onclick="signup()">立即报名</button>
        </div>
        <div style="padding-top:8px;border-top:1px solid rgba(255,255,255,0.06)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <div style="font-size:13px;font-weight:600;color:#f0f5ff">等级步步高</div>
            <span style="font-size:10px;padding:2px 8px;border-radius:5px;background:rgba(167,139,250,0.18);color:#a78bfa">永久</span>
          </div>
          <div style="font-size:11px;color:#a0b4d2">签到升级解锁特权</div>
        </div>
      </div>

      <!-- 公告 -->
      <div class="card">
        <div style="font-size:15px;font-weight:600;color:#f0f5ff;margin-bottom:8px">公告</div>
        <div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06)">
          <div style="font-size:12px;color:#d4e4fb">栈序OS 1.2 灰度推送中</div>
          <div style="font-size:10px;color:#607494;margin-top:2px">2026-10-30</div>
        </div>
        <div style="padding:6px 0">
          <div style="font-size:12px;color:#d4e4fb">有奖建议信活动开启</div>
          <div style="font-size:10px;color:#607494;margin-top:2px">2026-10-28</div>
        </div>
      </div>
    </div>

    <!-- 工单 -->
    <div class="view" id="view-ticket">
      <div class="card">
        <div class="liquid" style="width:100px;height:100px;background:#f87171;bottom:-20px;right:-20px"></div>
        <div style="font-size:15px;font-weight:600;color:#f0f5ff;margin-bottom:10px">提交工单</div>
        <input type="text" id="ticketTitle" placeholder="工单标题">
        <textarea id="ticketDesc" placeholder="描述遇到的问题..." rows="3"></textarea>
        <button onclick="submitTicket()" style="width:100%;padding:11px;background:rgba(248,113,113,0.15);border:1px solid rgba(248,113,113,0.35);color:#f87171;border-radius:10px;font-size:13px;cursor:pointer">提交工单</button>
      </div>
    </div>

    <!-- 我的 -->
    <div class="view" id="view-me">
      <!-- 账户信息 -->
      <div class="card">
        <div class="liquid" style="width:120px;height:120px;background:#fbbf24;top:-30px;left:-20px"></div>
        <div style="font-size:14px;font-weight:600;color:#f0f5ff;margin-bottom:10px">账户服务</div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px">
          <span style="color:#607494">账户余额</span>
          <span style="color:#34d399;font-weight:600">¥0.00</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px">
          <span style="color:#607494">账户等级</span>
          <span style="color:#fbbf24;font-weight:600">Lv.3 签到达人</span>
        </div>
      </div>

      <!-- 开发者中心 -->
      <div class="card" onclick="openDevCenter()" style="cursor:pointer">
        <div class="liquid" style="width:120px;height:120px;background:#34d399;top:-30px;right:-20px"></div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-size:14px;font-weight:600;color:#f0f5ff;margin-bottom:3px">开发者中心</div>
            <div style="font-size:11px;color:#607494">API / 表盘 SDK / 应用发布</div>
          </div>
          <span id="devBadge" style="font-size:10px;padding:3px 8px;border-radius:5px;background:rgba(167,139,250,0.18);color:#a78bfa">需超管授权</span>
        </div>
      </div>

      <!-- 管理员列表 -->
      <div class="card">
        <div style="font-size:14px;font-weight:600;color:#f0f5ff;margin-bottom:8px">管理员列表</div>
        <div id="adminList"></div>
      </div>

      <!-- 用户列表 -->
      <div class="card">
        <div style="font-size:14px;font-weight:600;color:#f0f5ff;margin-bottom:8px">用户列表</div>
        <div id="userList"></div>
      </div>
    </div>
  </div>
</div>

<!-- 个人资料弹窗 -->
<div class="mask" id="profileMask" onclick="if(event.target===this)closeProfile()">
  <div class="sheet">
    <h3>个人资料</h3>
    <div style="font-size:12px;color:#607494;margin-bottom:8px">选择头像</div>
    <div class="avatar-grid" id="avatarGrid"></div>
    <div style="font-size:12px;color:#607494;margin-bottom:8px">昵称</div>
    <input type="text" id="editName" placeholder="输入昵称">
    <div style="font-size:12px;color:#607494;margin-bottom:8px">个人简介</div>
    <input type="text" id="editBio" placeholder="写一句话介绍自己">
    <button class="btn btn-primary" onclick="saveProfile()">保存</button>
    <button class="btn btn-ghost" onclick="closeProfile()">取消</button>
    <button class="btn btn-ghost" onclick="doLogout()" style="color:#f87171;border-color:rgba(248,113,113,0.3)">退出登录</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const AVATAR_COLORS = [
  ['#73b8ff','#a78bfa'],['#f59e0b','#ef4444'],['#34d399','#10b981'],
  ['#f472b6','#ec4899'],['#60a5fa','#3b82f6'],['#fbbf24','#f59e0b']
];
const ACCOUNTS = {
  "100000000": { hash:"b17349ef2f8a82e224e4d3b8f3e4355702dca317a7f0d90cf61d9ddada6217b7", name:"张岳", level:"超级管理员" },
  "100000001": { hash:"ef797c8118f02dfb649607dd5d3f8c7623048c9c063d532cc95c5ed7a898a64f", name:"徐文桐", level:"超级管理员" },
  "100000020": { hash:"8ca6337698a3a754baf957d8c76aa9eb484a22a76d72f1aa17ee19172fe24fee", name:"陆宇", level:"管理员" },
  "100000013": { hash:"c50bff302bd82f766a9d190f1b0fe6561b749c5bc78bd1c52fcc829448444989", name:"周天浩", level:"管理员" },
  "100000014": { hash:"ef797c8118f02dfb649607dd5d3f8c7623048c9c063d532cc95c5ed7a898a64f", name:"迪", level:"管理员" },
  "100000022": { hash:"719f200fe85229938f31a2221e5910dd240cdda48ebf56f62d193df193c09adc", name:"蔡子润", level:"管理员" },
  "100000021": { hash:"aac8a922d7ac3a1fa25f4ac118a29ec022e245fd0195ca55bd98b64b77b53278", name:"闻浩楠", level:"管理员" },
  "100000025": { hash:"c89d383ab20c398cba45862a3a2645668bddbcdc3a655a850c562f95ad8b3bac", name:"秦之俊", level:"管理员" },
  "100000026": { hash:"5de5508b36a6a4aee8faa6a19704ddf1ffd074e4bda2b5a58921926a3e4545a7", name:"徐子俊", level:"管理员" },
  "100200000": { hash:"b5c75748560b4c3c46d8c3433759f97b50869e5259f80001fc035ff74329ea40", name:"哈哈", level:"普通用户" }
};
let myAvatarIdx=0, myName='', myBio='';

async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function doLogin(){
  const u=document.getElementById('inpUser').value.trim(),p=document.getElementById('inpPwd').value;
  const err=document.getElementById('loginErr');
  if(!u||!p){err.textContent='请输入账号和密码';return}
  const acc=ACCOUNTS[u];
  if(!acc){err.textContent='账号或密码错误';return}
  if(await sha256(p)!==acc.hash){err.textContent='账号或密码错误';return}
  sessionStorage.setItem('zx_user',u);myName=acc.name;enterApp();
}
function enterApp(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('app').classList.add('logged-in');
  document.getElementById('myName').textContent=myName;
  document.getElementById('myAvatar').textContent=myName.charAt(0);
  // 开发者中心标签
  const acc=ACCOUNTS[sessionStorage.getItem('zx_user')];
  const badge=document.getElementById('devBadge');
  if(acc.level==='超级管理员'){
    badge.textContent='已授权';badge.style.background='rgba(52,211,153,0.18)';badge.style.color='#34d399';
  }
  renderLists();
}
function renderLists(){
  const admins=Object.entries(ACCOUNTS).filter(([_,a])=>a.level!=='普通用户');
  const users=Object.entries(ACCOUNTS).filter(([_,a])=>a.level==='普通用户');
  const row=(uid,a)=>{
    const c=AVATAR_COLORS[uid.slice(-1)%6];
    const badge=a.level==='超级管理员'?'<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(251,191,36,0.18);color:#fbbf24;margin-left:6px">超管</span>':a.level==='管理员'?'<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(115,184,255,0.18);color:#73b8ff;margin-left:6px">管理员</span>':'';
    return `<div style="display:flex;align-items:center;gap:10px;padding:6px 0">
      <div style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#080b12;background:linear-gradient(135deg,${c[0]},${c[1]})">${a.name.charAt(0)}</div>
      <div style="flex:1"><div style="font-size:13px;color:#d4e4fb">${a.name}${badge}</div><div style="font-size:10px;color:#607494">${uid}</div></div>
    </div>`;
  };
  document.getElementById('adminList').innerHTML=admins.map(([uid,a])=>row(uid,a)).join('');
  document.getElementById('userList').innerHTML=users.length?users.map(([uid,a])=>row(uid,a)).join(''):'<div style="font-size:12px;color:#607494;text-align:center;padding:10px">暂无用户</div>';
}
function doSign(){
  const btn=document.getElementById('btnSign');
  if(btn.classList.contains('done')){toast('今日已签到');return}
  btn.classList.add('done');btn.textContent='已签到';
  document.getElementById('signDays').textContent=parseInt(document.getElementById('signDays').textContent)+1;
  toast('签到成功 +1 天');
}
function signup(){toast('服务器压力过大，请稍后重试')}
function submitTicket(){
  const t=document.getElementById('ticketTitle').value.trim(),d=document.getElementById('ticketDesc').value.trim();
  if(!t||!d){toast('请填写标题和描述');return}
  document.getElementById('ticketTitle').value='';document.getElementById('ticketDesc').value='';
  toast('工单已提交');
}
function openDevCenter(){
  const acc=ACCOUNTS[sessionStorage.getItem('zx_user')];
  if(acc.level==='超级管理员'){location.href='dev.html'}
  else{toast('开发者中心需超管授权，请联系张岳/徐文桐')}
}
function openProfile(){
  document.getElementById('editName').value=myName;
  document.getElementById('editBio').value=myBio;
  document.getElementById('avatarGrid').innerHTML=AVATAR_COLORS.map((c,i)=>
    `<div class="avatar-opt ${i===myAvatarIdx?'sel':''}" style="background:linear-gradient(135deg,${c[0]},${c[1]})" onclick="selAvatar(${i})">${myName.charAt(0)}</div>`
  ).join('');
  document.getElementById('profileMask').style.display='block';
}
function selAvatar(i){myAvatarIdx=i;document.querySelectorAll('.avatar-opt').forEach((el,j)=>el.classList.toggle('sel',j===i))}
function saveProfile(){
  const n=document.getElementById('editName').value.trim(),b=document.getElementById('editBio').value.trim();
  if(n)myName=n;myBio=b;
  document.getElementById('myName').textContent=myName;
  document.getElementById('myAvatar').textContent=myName.charAt(0);
  closeProfile();toast('资料已保存');
}
function closeProfile(){document.getElementById('profileMask').style.display='none'}
function doLogout(){sessionStorage.removeItem('zx_user');location.reload()}
function toast(t){
  const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');
  clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove('show'),2000);
}
// tab 切换
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('view-'+t.dataset.view).classList.add('active');
  }
});
// 启动
const u=sessionStorage.getItem('zx_user');
if(u&&ACCOUNTS[u]){myName=ACCOUNTS[u].name;enterApp()}
</script>
</body>
</html>
