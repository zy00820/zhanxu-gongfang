<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>栈序工坊 · 用户登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#080b12;position:relative;overflow:hidden;padding:20px;
  background-image:
    linear-gradient(rgba(20,40,80,0.18) 1px,transparent 1px),
    linear-gradient(90deg,rgba(20,40,80,0.18) 1px,transparent 1px);
  background-size:40px 40px;
}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:0.5;pointer-events:none}
.blob-1{width:320px;height:320px;background:#4a9eff;top:-80px;left:-60px;animation:f1 12s ease-in-out infinite}
.blob-2{width:280px;height:280px;background:#a78bfa;bottom:-60px;right:-40px;animation:f2 14s ease-in-out infinite}
.blob-3{width:200px;height:200px;background:#34d399;top:40%;left:30%;opacity:0.3;animation:f3 16s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.15)}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,-40px) scale(1.1)}}
@keyframes f3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,20px) scale(0.9)}}
.login-box{
  position:relative;z-index:1;width:100%;max-width:380px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:24px;padding:36px 28px;
  box-shadow:0 8px 32px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.25);
}
.login-logo{text-align:center;margin-bottom:26px}
.login-logo .mark{
  width:56px;height:56px;border-radius:16px;
  background:linear-gradient(135deg,#73b8ff,#a78bfa);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:700;color:#fff;margin-bottom:14px;
  box-shadow:0 6px 20px rgba(115,184,255,0.4),inset 0 1px 0 rgba(255,255,255,0.4);
}
.login-logo h1{font-size:21px;color:#f0f5ff;font-weight:600}
.login-logo p{font-size:12.5px;color:rgba(255,255,255,0.55);margin-top:6px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:rgba(255,255,255,0.6);margin-bottom:7px}
.field input{
  width:100%;padding:13px 16px;background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);border-radius:12px;
  color:#fff;font-size:15px;outline:none;transition:all .25s;
  backdrop-filter:blur(10px);
}
.field input:focus{border-color:rgba(115,184,255,0.6);background:rgba(255,255,255,0.12);box-shadow:0 0 0 3px rgba(115,184,255,0.15)}
.field input::placeholder{color:rgba(255,255,255,0.3)}
.btn-login{
  width:100%;padding:14px;margin-top:10px;
  background:linear-gradient(135deg,#73b8ff,#5b8def);color:#fff;
  border:1px solid rgba(255,255,255,0.2);border-radius:12px;
  font-size:15px;font-weight:600;cursor:pointer;
  box-shadow:0 6px 20px rgba(91,141,239,0.35),inset 0 1px 0 rgba(255,255,255,0.3);
}
.btn-login:active{transform:scale(0.98);opacity:0.9}
.btn-register{
  width:100%;padding:13px;margin-top:10px;
  background:rgba(255,255,255,0.06);color:#94a8c7;
  border:1px solid rgba(255,255,255,0.12);border-radius:12px;
  font-size:14px;cursor:pointer;
}
.links{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}
.links a{color:rgba(115,184,255,0.7);text-decoration:none;cursor:pointer}
.back{display:block;text-align:center;margin-top:18px;font-size:12px;color:rgba(255,255,255,0.35);cursor:pointer;text-decoration:none}
.toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);
  background:rgba(20,28,45,0.95);border:1px solid rgba(115,184,255,0.3);
  color:#e8edf7;padding:12px 22px;border-radius:10px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .3s;z-index:999;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="login-box">
  <div class="login-logo">
    <div class="mark">栈</div>
    <h1>栈序工坊</h1>
    <p>用户登录 · 穿戴设备开发者社区</p>
  </div>
  <div class="field">
    <label>账号 / 手机号</label>
    <input type="text" id="user" placeholder="请输入账号或手机号" autocomplete="off">
  </div>
  <div class="field">
    <label>密码</label>
    <input type="password" id="pwd" placeholder="请输入密码">
  </div>
  <button class="btn-login" onclick="doLogin()">登 录</button>
  <button class="btn-register" onclick="registerMaint()">注 册</button>
  <div class="links">
    <a onclick="toast('请联系管理员重置密码')">忘记密码？</a>
    <a onclick="toast('暂未开放第三方登录')">验证码登录</a>
  </div>
  <a class="back" href="index.html">← 返回栈序工坊首页</a>
</div>

<div class="toast" id="toast"></div>

<script>
function doLogin(){
  const u=document.getElementById('user').value.trim();
  const p=document.getElementById('pwd').value;
  if(!u||!p){ toast('请输入账号和密码'); return; }
  toast('登录功能即将开放，敬请期待');
}
function registerMaint(){ toast('注册功能维护中，敬请期待'); }
function toast(txt){
  const t=document.getElementById('toast');
  t.textContent=txt;t.classList.add('show');
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>t.classList.remove('show'),2000);
}
</script>
</body>
</html>
