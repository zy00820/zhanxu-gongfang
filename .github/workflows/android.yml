name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/zhanxu-cloud.apk
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhanxu-cloud-apk
          path: out/zhanxu-cloud.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: 栈序云 App（自动构建）
          body: |
            由 GitHub Actions 自动编译的 WebView 套壳安装包。
            网页端版本：1.1.9
          files: out/zhanxu-cloud.apk
          make_latest: true
